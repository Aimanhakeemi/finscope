- question: How many transactions are there?
  gold_sql: SELECT COUNT(*) AS count FROM v_readonly_transactions
  gold_result:
    - count: 13
- question: What is the net amount in the account?
  gold_sql: SELECT SUM(amount) AS total FROM v_readonly_transactions
  gold_result:
    - total: 4836
- question: How much did I spend in total?
  gold_sql: SELECT -SUM(amount) AS spent FROM v_readonly_transactions WHERE amount < 0
  gold_result:
    - spent: 1164
- question: How much did I spend on coffee?
  gold_sql: SELECT -SUM(amount) AS spent FROM v_readonly_transactions WHERE category = 'coffee' AND amount < 0
  gold_result:
    - spent: 35
- question: How many coffee transactions are there?
  gold_sql: SELECT COUNT(*) AS count FROM v_readonly_transactions WHERE category = 'coffee'
  gold_result:
    - count: 5
- question: How much income was deposited?
  gold_sql: SELECT SUM(amount) AS income FROM v_readonly_transactions WHERE amount > 0
  gold_result:
    - income: 6000
- question: What is the earliest transaction date?
  gold_sql: SELECT MIN(txn_date) AS first_date FROM v_readonly_transactions
  gold_result:
    - first_date: '2026-01-05'
- question: What is the latest transaction date?
  gold_sql: SELECT MAX(txn_date) AS last_date FROM v_readonly_transactions
  gold_result:
    - last_date: '2026-08-15'
- question: What is the largest outgoing charge?
  gold_sql: SELECT MIN(amount) AS largest_charge FROM v_readonly_transactions WHERE amount < 0
  gold_result:
    - largest_charge: -1000
- question: What is the largest deposit?
  gold_sql: SELECT MAX(amount) AS largest_deposit FROM v_readonly_transactions WHERE amount > 0
  gold_result:
    - largest_deposit: 3000
- question: What is the average coffee charge?
  gold_sql: SELECT AVG(amount) AS average FROM v_readonly_transactions WHERE category = 'coffee'
  gold_result:
    - average: -7.0
- question: How much did I spend in January?
  gold_sql: SELECT -SUM(amount) AS spent FROM v_readonly_transactions WHERE txn_date >= '2026-01-01' AND txn_date < '2026-02-01' AND amount < 0
  gold_result:
    - spent: 25
- question: How much did I spend in February?
  gold_sql: SELECT -SUM(amount) AS spent FROM v_readonly_transactions WHERE txn_date >= '2026-02-01' AND txn_date < '2026-03-01' AND amount < 0
  gold_result:
    - spent: 22
- question: How many non-recurring transactions are there?
  gold_sql: SELECT COUNT(*) AS count FROM v_readonly_transactions WHERE is_recurring = FALSE
  gold_result:
    - count: 10
- question: How many recurring transactions are there?
  gold_sql: SELECT COUNT(*) AS count FROM v_readonly_transactions WHERE is_recurring = TRUE
  gold_result:
    - count: 3
- question: How much did recurring charges cost?
  gold_sql: SELECT -SUM(amount) AS spent FROM v_readonly_transactions WHERE is_recurring = TRUE AND amount < 0
