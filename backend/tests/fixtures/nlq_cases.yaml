- question: How many transactions does each merchant have?
  gold_sql: SELECT merchant, COUNT(*) AS count FROM v_readonly_transactions GROUP BY merchant ORDER BY merchant
  gold_result:
    - merchant: NETFLIX
      count: 2
    - merchant: RENT
      count: 1
    - merchant: SALARY
      count: 2
    - merchant: STARBUCKS
      count: 5
    - merchant: TARGET
      count: 1
    - merchant: WHOLE FOODS
      count: 2
- question: Which merchants cost the most?
  gold_sql: SELECT merchant, -SUM(amount) AS spent FROM v_readonly_transactions WHERE amount < 0 GROUP BY merchant ORDER BY spent DESC LIMIT 2
  gold_result:
    - merchant: RENT
      spent: 1000
    - merchant: TARGET
      spent: 50
