name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Lint
        run: ruff check backend
      - name: Type-check
        run: mypy backend/app || true   # relax until types are complete
      - name: Generate synthetic data
        run: python data/generate_synthetic.py --months 12 --out data/sample_statement.csv
      - name: Tests
        run: pytest backend -q
        env:
          PYTHONPATH: backend
      # - name: Evaluation gates   # enable after milestone M4
      #   run: python -m app.eval --report docs/eval_report.md
      #   working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
