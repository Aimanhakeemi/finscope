name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finscope
          POSTGRES_PASSWORD: finscope
          POSTGRES_DB: finscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finscope -d finscope"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://finscope:finscope@localhost:5432/finscope
      FINSCOPE_READONLY_PASSWORD: change-me
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Lint
        run: ruff check backend
      - name: Type-check
        run: mypy backend/app
      - name: Generate synthetic data
        run: python data/generate_synthetic.py --months 12 --out data/sample_statement.csv
      - name: Apply migrations
        run: alembic upgrade head
        working-directory: backend
      - name: Tests
        run: pytest backend -q
        env:
          PYTHONPATH: backend
      # - name: Evaluation gates   # enable after milestone M4
      #   run: python -m app.eval --report docs/eval_report.md
      #   working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
