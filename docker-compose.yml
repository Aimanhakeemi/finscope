services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finscope
      POSTGRES_PASSWORD: finscope
      POSTGRES_DB: finscope
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finscope"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://finscope:finscope@db:5432/finscope
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FINSCOPE_LLM_MODEL: ${FINSCOPE_LLM_MODEL:-claude-sonnet-5}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  pgdata:
